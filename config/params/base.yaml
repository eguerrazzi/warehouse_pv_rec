# Parameter registry — base case (specification Appendix A, approved by Ema 17/11/2026,
# with the changes approved on 18/11/2026 recorded in docs/decisions.md).
#
# Every number carries its source and source type (specification Section 3).
# Derived entries have value: null and a formula; the loader computes them.
# Guerrazzi et al. (2019) = Guerrazzi, Mininno, Aloini, Dulmin, Scarpelli, Sabatini. Energy Evaluation of
#   Deep-Lane Autonomous Vehicle Storage and Retrieval System. Sustainability 11(14) 3817, doi:10.3390/su11143817

meta:
  name: base
  description: SME with a pallet deep-lane AVS/RS in Torrita di Siena (Tuscany), inspired by Guerrazzi et al. (2019) (Cassioli)
  approved: "2026-11-17 (sheet); 2026-11-18 (C, energy per mission, pallet mass, economics, ranges, profiles)"

parameters:
  # ================================================================ A.1 Warehouse
  - id: system_type
    group: warehouse
    description: Storage system type
    value: "pallet deep-lane AVS/RS, 2,730 locations, 5 levels, 2 lifts, 6 shuttles with satellite"
    unit: "-"
    sensitivity: ["SBS/RS for totes"]
    source: "Guerrazzi et al. (2019), Sect. 5.1 p. 9 and Table A1 p. 12 (Cassioli)"
    source_type: literature
    used_by: [report]
    notes: "Guerrazzi et al. (2019) p. 5 says 1 shuttle per tier (5 tiers); the installed power on p. 9 counts 6 shuttles."

  - id: avsrs_installed_power
    group: warehouse
    description: Installed power of the AVS/RS (2 lifts + 6 shuttles)
    value: 44.6
    unit: kW
    source: "Guerrazzi et al. (2019), Sect. 5.1 p. 9"
    source_type: literature
    used_by: [report]

  - id: n_tiers
    group: warehouse
    symbol: "N_z"
    description: Number of rack tiers (one tier-captive shuttle each)
    value: 5
    unit: tiers
    source: "Guerrazzi et al. (2019), Table A1 p. 12; Sect. 4.1 p. 5 (1 shuttle per tier)"
    source_type: literature
    used_by: [model]

  - id: location
    group: warehouse
    description: Site location
    value: "Torrita di Siena (SI), Italy"
    unit: "-"
    sensitivity: ["North Italy", "South Italy"]
    source: "Ema's decision 17/11/2026"
    source_type: design_choice
    used_by: [data, report]

  - id: site_latitude
    group: warehouse
    description: Site latitude (Torrita di Siena)
    value: 43.1668
    unit: "deg N"
    source: "OpenStreetMap Nominatim, Torrita di Siena municipality (relation 42341), retrieved 2026-11-18; matches the spec (about 43.17 N, 11.77 E)"
    source_type: real
    used_by: [data]

  - id: site_longitude
    group: warehouse
    description: Site longitude (Torrita di Siena)
    value: 11.7716
    unit: "deg E"
    source: "OpenStreetMap Nominatim, Torrita di Siena municipality (relation 42341), retrieved 2026-11-18; matches the spec (about 43.17 N, 11.77 E)"
    source_type: real
    used_by: [data]

  - id: shift_start
    group: warehouse
    description: Start of the working day (2 shifts, Mon-Fri)
    value: 6
    unit: "h (clock)"
    sensitivity: ["1 shift", "3 shifts"]
    source: "Parameter sheet 17/11/2026: 2 shifts 06-22; Guerrazzi et al. (2019) p. 9: each run covers 15/16 h of activity"
    source_type: estimate
    used_by: [model]

  - id: shift_end
    group: warehouse
    description: End of the working day (2 shifts, Mon-Fri)
    value: 22
    unit: "h (clock)"
    sensitivity: ["1 shift", "3 shifts"]
    source: "Parameter sheet 17/11/2026: 2 shifts 06-22; Guerrazzi et al. (2019) p. 9: each run covers 15/16 h of activity"
    source_type: estimate
    used_by: [model]

  - id: calendar_year
    group: warehouse
    description: Reference year of the working-day calendar (weights w_d of the 12 days)
    value: 2025
    unit: year
    source: "Same year as the GME prices: last complete year (spec Sect. 4). Working days = Mon-Fri minus Italian national holidays; patron-saint holiday not included"
    source_type: design_choice
    used_by: [model, data]
    notes: "2025 gives 251 working days (sheet: 250, kept as a check)."

  - id: missions_per_day
    group: warehouse
    symbol: "N"
    description: AVS/RS missions per working day
    value: 1500
    unit: missions/day
    sensitivity: {low: 800, high: 3000}
    source: "Guerrazzi et al. (2019) Table A6 p. 13 (600 storages + 600 retrievals, about 1,200/day), raised to 1,500 by Ema's decision 17/11/2026; consistent with Lupi et al. (2024) IJAMT 131:1449, Sect. 4 p. 1460: 52,018 storages + 61,132 retrievals in 74 working days = 1,529/day (real deep-lane AVS/RS, beverage industry)"
    source_type: estimate
    used_by: [model]

  - id: n_inbound
    group: warehouse
    symbol: "n_{in}"
    description: Inbound storage missions per day
    value: 650
    unit: missions/day
    sensitivity: {scale_with: missions_per_day}
    source: "Mission split of the approved sheet (from the 25% shiftable share), confirmed by Ema 17/11/2026"
    source_type: assumption
    used_by: [model]

  - id: n_picks
    group: warehouse
    symbol: "n_{pick}"
    description: Picking missions per day (orders)
    value: 650
    unit: missions/day
    sensitivity: {scale_with: missions_per_day}
    source: "Mission split of the approved sheet (from the 25% shiftable share), confirmed by Ema 17/11/2026"
    source_type: assumption
    used_by: [model]

  - id: n_replenishment
    group: warehouse
    symbol: "n_{repl}"
    description: Replenishment missions of the picking area per day
    value: 100
    unit: missions/day
    sensitivity: {scale_with: missions_per_day}
    source: "Mission split of the approved sheet (from the 25% shiftable share), confirmed by Ema 17/11/2026"
    source_type: assumption
    used_by: [model]

  - id: n_reslotting
    group: warehouse
    symbol: "n_{slot}"
    description: Re-slotting missions per day
    value: 100
    unit: missions/day
    sensitivity: {scale_with: missions_per_day}
    source: "Mission split of the approved sheet (from the 25% shiftable share), confirmed by Ema 17/11/2026"
    source_type: assumption
    used_by: [model]

  - id: shiftable_share
    group: warehouse
    description: Share of shiftable missions (pre-picking, replenishment, re-slotting)
    value: 25
    unit: "%"
    sensitivity: {low: 10, high: 40}
    source: "Shiftable-activities document (project notes, 17/11/2026)"
    source_type: assumption
    used_by: [model]
    notes: "Nominal shiftable volume of the split: 100 + 100 + 30% of 650 = 395 missions (26%)."

  - id: pallet_mass
    group: warehouse
    symbol: "m_{UL}"
    description: Mass of a unit load (pallet)
    value: 1200
    unit: kg
    source: "Guerrazzi et al. (2019), Table A5 p. 13"
    source_type: literature
    used_by: [report]
    notes: "Was 100 kg (Ekren, Akpunar, Lerher 2016) in the sheet of 17/11; Guerrazzi et al. (2019) adopted by Ema's decision 18/11/2026."

  - id: e_mission_gross_kj
    group: warehouse
    description: Gross energy per AVS/RS mission, as published (mean over storage and picking)
    value: 75
    unit: kJ/mission
    sensitivity: {low: 72.0, high: 133.56}
    source: "Guerrazzi et al. (2019), Table 2 p. 9 (energy consumed per UL: mean 75, min 70, max 80 kJ). Range: Akpunar, Ekren, Lerher (2017), J Appl Eng Sci 15(1) 25-34, Table 2 p. 34: 0.0200-0.0371 kWh per transaction (AVS/RS, 1,000-kg pallets, 5-9 tiers)"
    source_type: literature
    used_by: [model]
    notes: "Range of the sheet (0.0197-0.0406 kWh, attributed to Ekren et al. 2016) replaced by the verified range of Akpunar et al. 2017 (18/11/2026). Was 30 Wh (Ekren et al. 2016) in the sheet of 17/11; Guerrazzi et al. (2019) adopted by Ema's decision 18/11/2026. Storing 98 kJ/UL, picking 52 kJ/UL (Table 2)."

  - id: e_mission_gross
    group: warehouse
    symbol: "e"
    description: Gross energy per AVS/RS mission
    value: null
    formula: "e_mission_gross_kj / KJ_PER_WH"
    unit: Wh/mission
    source: "Unit conversion of e_mission_gross_kj"
    source_type: derived
    used_by: [model]

  - id: regen_share
    group: warehouse
    symbol: "\\varrho"
    description: Share of consumed energy recovered by regenerative braking of the lifts
    value: 28.3
    unit: "% of consumed energy"
    sensitivity: {low: 0, high: 35}
    source: "Guerrazzi et al. (2019), Sect. 6 p. 11 and Fig. 4 (28.3%)"
    source_type: literature
    used_by: [model]
    notes: "The sheet of 17/11 rounded it to 28; the published value is used."

  - id: e_mission_net
    group: warehouse
    symbol: "e^n"
    description: Net energy per AVS/RS mission
    value: null
    formula: "e_mission_gross * (1 - regen_share / PERCENT)"
    unit: Wh/mission
    source: "e (1 - rho), approved formula (sheet 17/11/2026)"
    source_type: derived
    used_by: [model]
    notes: "Check: Guerrazzi et al. (2019) Tables 2-3 give (75 - 21) kJ = 15.0 Wh net per UL."

  - id: e_mission_sbsrs
    group: warehouse
    description: Energy per mission, SBS/RS tote variant
    value: 0.7
    unit: Wh/mission
    sensitivity: {low: 0.65, high: 0.71}
    source: "Lerher, Ekren, Akpunar (2016), Simulation-based Energy and Cycle Time Analysis of SBS/RS, 14th IMHRC, Karlsruhe, Table 2 p. 10: 0.000649-0.000709 kWh per transaction (14 tiers, lift 2 m/s)"
    source_type: literature
    used_by: [model]
    notes: "Up to 0.0009 kWh with 16 tiers and lift 3 m/s (Fig. 6)."

  - id: avsrs_standby_kw
    group: loads
    description: AVS/RS base (stand-by) load during shifts
    value: 3
    unit: kW
    sensitivity: {low: 1.5, high: 4}
    source: "Ertl & Günthner (2016), Logistics Journal: 0.5-1.25 kW per machine"
    source_type: estimate
    used_by: [model]

  # ================================================================ Capacity and congestion
  - id: sim_total_energy_kj
    group: capacity
    description: Total energy of one simulated day of the Cassioli AVS/RS (mean of 100 runs)
    value: 88268
    unit: kJ
    source: "Guerrazzi et al. (2019), Table 2 p. 9"
    source_type: literature
    used_by: [model]

  - id: sim_hourly_energy_kj
    group: capacity
    description: Hourly energy of the simulated day (mean of 100 runs)
    value: 5772
    unit: kJ/h
    source: "Guerrazzi et al. (2019), Table 2 p. 9"
    source_type: literature
    used_by: [model]

  - id: sim_missions
    group: capacity
    description: Missions of the simulated day (600 storages + 600 retrievals)
    value: 1200
    unit: missions
    source: "Guerrazzi et al. (2019), Table A6 p. 13"
    source_type: literature
    used_by: [model]

  - id: mission_cycle_time
    group: capacity
    description: Mean time per mission of the AVS/RS operated sequentially (single command)
    value: null
    formula: "sim_total_energy_kj / sim_hourly_energy_kj * SECONDS_PER_HOUR / sim_missions"
    unit: s/mission
    source: "Run length of Guerrazzi et al. (2019) (total / hourly energy, Table 2) divided by the missions (Table A6)"
    source_type: derived
    used_by: [model]
    notes: "Cross-check: 46.2 s recomputed from eq. (1)-(2) and Tables A1-A3 (notebooks/cycle_time_check.py). The Guerrazzi et al. (2019) simulator uses single command and no concurrent shuttles (p. 6); its cycle time excludes the lifts (p. 6)."

  - id: n_active_shuttles
    group: capacity
    description: Tier shuttles working concurrently
    value: 5
    unit: shuttles
    sensitivity: [1, 2, 3, 4, 5]
    source: "Assumption (18/11/2026, delegated by Ema): the 5 tier-captive shuttles of Guerrazzi et al. (2019) (p. 5) work in parallel; 1 reproduces the sequential simulation of Guerrazzi et al. (2019) (p. 6)"
    source_type: assumption
    status: to_verify
    used_by: [model]
    notes: "To check with the Guerrazzi & Vandin simulator (Phase 8) or with Cassioli data."

  - id: capacity_c
    group: capacity
    symbol: "C"
    description: Hourly capacity of the AVS/RS
    value: null
    formula: "n_active_shuttles * SECONDS_PER_HOUR / mission_cycle_time"
    unit: missions/h
    source: "Tier shuttles in parallel, each at the Guerrazzi et al. (2019) mean mission time; replaces the formula of spec Sect. 3.5 (lifts are dedicated and not the bottleneck in Guerrazzi et al. (2019))"
    source_type: derived
    status: to_verify
    used_by: [model]
    notes: "Supporting evidence: Guerrazzi & Vandin (2026) Table 8, fleet utilisation below 10% with 1,000-1,529 missions/day on 10 shuttles; D'Antonio & Chiabert (2019) IJAMT 104:1919, Fig. 3: 25-145 UL/h for one lift serving 1-5 tier-to-tier shuttles (lift-bound). With the fixed handling times of Lupi et al. (2024) Table 3 (7 s load/unload, 5 s couple/uncouple) the mission time becomes 62.2 s and C = 289 missions/h, inside the sensitivity range (3-4 concurrent shuttles). Lifts: 9-12 s per cycle, 300-400 missions/h each (eq. 1, Table A2), so not binding. n_active_shuttles = 1 gives 78.5 missions/h, infeasible for the base case."

  - id: rho_max
    group: capacity
    symbol: "\\bar\\rho"
    description: Maximum utilisation of the AVS/RS in any hour
    value: 0.9
    unit: "-"
    sensitivity: {low: 0.8, high: 0.95}
    source: "Common practice for queueing systems (approved sheet 17/11/2026)"
    source_type: assumption
    used_by: [model]

  - id: n_pwl_cuts
    group: capacity
    symbol: "|L|"
    description: Linear pieces of the M/M/1 congestion curve
    value: 4
    unit: cuts
    source: "Specification Sect. 5.5 (V6)"
    source_type: design_choice
    used_by: [model]

  # ================================================================ Forklifts and docks
  - id: n_forklifts
    group: forklifts
    symbol: "|F|"
    description: Lithium-ion forklifts serving the docks
    value: 4
    unit: forklifts
    sensitivity: {low: 2, high: 8}
    source: "Assumption of the approved sheet 17/11/2026"
    source_type: assumption
    used_by: [model]

  - id: forklift_use_hours
    group: forklifts
    description: Use of each forklift at the docks
    value: 5
    unit: h/day per forklift
    sensitivity: {low: 3, high: 8}
    source: "Assumption of the approved sheet 17/11/2026"
    source_type: assumption
    used_by: [model]

  - id: dock_hours_total
    group: forklifts
    symbol: "\\sum_t h_t"
    description: Total dock workload
    value: null
    formula: "n_forklifts * forklift_use_hours"
    unit: cart-h/day
    source: "Forklifts x use per forklift (sheet 17/11/2026)"
    source_type: derived
    used_by: [model]

  - id: dock_share_inbound
    group: forklifts
    description: Share of the dock workload proportional to inbound arrivals u_t (rest uniform over the outbound window)
    value: 50
    unit: "%"
    sensitivity: {low: 37.5, high: 62.5}
    source: "Proposed default, specification Sect. 3.5 (capped at |F| per hour)"
    source_type: assumption
    notes: "Generic range approved by Ema 18/11/2026 for assumptions without a range in the sheet: +/-25% (magnitudes), +/-1 h (clock times); default confirmed by Ema 18/11/2026"
    used_by: [model]

  - id: dock_outbound_start
    group: forklifts
    description: Start of the outbound dock window
    value: 6
    unit: "h (clock)"
    sensitivity: {low: 6, high: 7}
    source: "Proposed default, specification Sect. 3.5 (outbound before the cut-off)"
    source_type: assumption
    notes: "Generic range approved by Ema 18/11/2026 for assumptions without a range in the sheet: +/-25% (magnitudes), +/-1 h (clock times); default confirmed by Ema 18/11/2026"
    used_by: [model]

  - id: dock_outbound_end
    group: forklifts
    description: End of the outbound dock window
    value: 16
    unit: "h (clock)"
    sensitivity: {low: 15, high: 17}
    source: "Proposed default, specification Sect. 3.5 (outbound before the cut-off)"
    source_type: assumption
    notes: "Generic range approved by Ema 18/11/2026 for assumptions without a range in the sheet: +/-25% (magnitudes), +/-1 h (clock times); default confirmed by Ema 18/11/2026"
    used_by: [model]

  - id: forklift_kwh_per_h
    group: forklifts
    symbol: "k"
    description: Forklift consumption per hour of use
    value: 4
    unit: kWh/h
    sensitivity: {low: 3, high: 5}
    source: "Order of magnitude for 2-2.5 t trucks (approved sheet 17/11/2026); to verify on VDI 2198 datasheets"
    source_type: estimate
    status: to_verify
    used_by: [model]

  - id: battery_kwh
    group: forklifts
    symbol: "Q"
    description: Forklift battery capacity
    value: 25
    unit: kWh
    sensitivity: {low: 20, high: 40}
    source: "Datasheets of 2-2.5 t lithium forklifts (approved sheet 17/11/2026); to verify"
    source_type: estimate
    status: to_verify
    used_by: [model]

  - id: charger_kw
    group: forklifts
    symbol: "P^{ch}"
    description: Charger power per forklift
    value: 8
    unit: kW
    sensitivity: {low: 4, high: 12}
    source: "Datasheets (approved sheet 17/11/2026); to verify"
    source_type: estimate
    status: to_verify
    used_by: [model]

  - id: soc_min
    group: forklifts
    symbol: "SOC^{min}"
    description: Minimum battery state of charge
    value: 20
    unit: "%"
    sensitivity: {low: 10, high: 30}
    source: "Assumption of the approved sheet 17/11/2026"
    source_type: assumption
    used_by: [model]

  - id: charge_efficiency
    group: forklifts
    symbol: "\\eta"
    description: Charging efficiency
    value: 0.92
    unit: "-"
    sensitivity: {low: 0.85, high: 0.95}
    source: "Value of the approved sheet 17/11/2026; no source cited there"
    source_type: estimate
    status: to_verify
    used_by: [model]
    notes: "An estimate needs an anchor (datasheet or paper); to find."

  - id: charging_hours
    group: forklifts
    symbol: "\\chi_t"
    description: Hours in which charging is allowed
    value: shifts
    unit: "-"
    sensitivity: ["shifts", "shifts and night"]
    source: "Within shifts, confirmed by Ema 17/11/2026"
    source_type: design_choice
    used_by: [model]

  # ================================================================ Fixed loads
  - id: lighting_kw
    group: loads
