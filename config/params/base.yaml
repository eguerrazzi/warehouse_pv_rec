    source_type: design_choice
    used_by: [model]

  # ================================================================ A.2 Photovoltaics
  - id: pv_kwp
    group: pv
    description: Installed PV power
    value: 70
    unit: kWp
    sensitivity: {low: 40, high: 200}
    source: "Resized by Ema 18/11/2026 with the PVGIS yield: about 100 MWh/yr / 1,401 kWh/kWp (PVGIS-SARAH3 typical year) = 71, rounded to 70 (sheet 17/11: 80 kWp from 1,300 kWh/kWp)"
