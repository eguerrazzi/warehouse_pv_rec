    expected: {lighting: 29, handling: 14, other: 57}
    unit: "%"
    source: "Perotti & Dobers, Polimi green warehousing benchmark (ambient: lighting + handling > 60%)"
    source_type: real

  - id: annual_site_consumption
    description: Annual site consumption (sum of the base-case balance)
    expected: {about: 100, low: 70, high: 150}
    unit: MWh/yr
    source: "Sum of the base-case balance, approved sheet 17/11/2026"
    source_type: estimate
    notes: "Computed by the model in Phase 3 and compared with this range."

  - id: daily_balance
    description: Base-case daily balance per working day
    expected: {missions_net: 32, missions_gross: 45, avsrs_base: 48, forklift_charging: 80, lighting: 60, offices_it: 80, other: 40}
    unit: kWh/day
    source: "Approved sheet 17/11/2026"
    source_type: estimate
    status: to_verify
    notes: "Mission values refer to e = 30 Wh; with Guerrazzi et al. (2019) (18/11) they become about 31 gross and 22 net. Lighting 60 vs 4 kW x 16 h = 64."

  - id: offshift_standby_annual
    description: Night and weekend stand-by consumption
    expected: {about: 9}
    unit: MWh/yr
    source: "Approved sheet 17/11/2026"
    source_type: estimate

  - id: shiftable_energy_daily
    description: Energy of shiftable activities per working day
    expected: {about: 90}
    unit: kWh/day
    source: "Approved sheet 17/11/2026"
    source_type: estimate

  - id: specific_yield
    description: PV specific yield, Centre Italy
    expected: {about: 1300, low: 1000, high: 1550}
    unit: kWh/kWp/yr
    source: "solareindustriale.it 2026; replaced by the PVGIS value in Phase 2 (expected 1,200-1,350)"
    source_type: estimate

consistency:
  - "n_inbound + n_picks + n_replenishment + n_reslotting == missions_per_day"
  - "n_active_shuttles <= n_tiers"
  - "shift_start < cutoff_hour <= shift_end"
  - "stock_min_days <= stock_initial_days"
  - "inbound_start >= shift_start and inbound_end <= shift_end"
  - "shift_start <= order_arrival_start < order_arrival_end <= cutoff_hour"
  - "shift_start < p0_morning_end <= p0_evening_start < shift_end"
  - "shift_start <= p1_sun_start < p1_sun_end <= shift_end"
  - "shift_start <= dock_outbound_start < dock_outbound_end <= shift_end"
