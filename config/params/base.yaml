    sensitivity: {low: 1.875, high: 3.125}
    source: "Assumption of the approved sheet 17/11/2026"
    source_type: assumption
    notes: "Generic range approved by Ema 18/11/2026 for assumptions without a range in the sheet: +/-25% (magnitudes), +/-1 h (clock times)"
    used_by: [model]

  - id: offshift_standby_kw
    group: loads
    description: Site stand-by load outside shifts and on weekends
    value: 2
    unit: kW
    sensitivity: {low: 1.5, high: 2.5}
    source: "Assumption of the approved sheet 17/11/2026"
    source_type: assumption
    notes: "Generic range approved by Ema 18/11/2026 for assumptions without a range in the sheet: +/-25% (magnitudes), +/-1 h (clock times)"
    used_by: [model]

  - id: fixed_load_shape
    group: loads
    description: Hourly shape of the fixed load within shifts
    value: flat
