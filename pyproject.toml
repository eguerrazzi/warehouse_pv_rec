[project]
name = "wpvrec"
version = "0.0.1"
description = "Warehouse + rooftop PV + Renewable Energy Community: bi-objective LP for shifting internal logistics work into PV hours"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Emanuele Guerrazzi" }]
requires-python = ">=3.11"
dependencies = [
    "pyomo>=6.8",
    "highspy>=1.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pvlib>=0.11",
    "plotly>=5.22",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.36"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
wpvrec = "wpvrec.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wpvrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
