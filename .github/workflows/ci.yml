name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Conda export in sync with uv.lock
        run: |
          uv export --format requirements-txt --no-hashes --all-extras --all-groups --no-emit-project --quiet -o /tmp/req.txt
          diff -I '^#' /tmp/req.txt requirements.lock.txt
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Test (fixtures only)
        run: uv run pytest
